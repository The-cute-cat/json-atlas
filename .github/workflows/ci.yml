name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: 前端检查与构建
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 语法检查
        run: npm run check

      - name: 数据回归测试
        run: npm test

      - name: 构建前端
        run: npm run build

  desktop:
    name: 桌面端编译检查
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # tauri-build 在编译期会校验 frontendDist 目录存在，因此先出一次前端产物。
      - name: 构建前端
        run: npm run build

      # rust-toolchain.toml 已把 channel 固定为 stable-x86_64-pc-windows-msvc，
      # 与 windows-latest 主机一致，因此这里不再指定 toolchain。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --locked

      # debug 与 release 的构建脚本行为可能不同，只在 debug 下检查会漏掉
      # 仅 release 复现的编译失败。实例：indexmap 1.9 的 sysroot 探测在
      # release 下失败，导致 schemars 0.8 报 E0107，而 cargo check 正常。
      # 详见 src-tauri/Cargo.toml 末尾的上游 workaround 说明。
      - name: cargo check（release profile）
        working-directory: src-tauri
        run: cargo check --release --locked

      - name: 桌面端回归测试
        working-directory: src-tauri
        run: cargo test --locked

      # 与 release 工作流保持一致：clippy 警告即失败，避免只在打标签时暴露。
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --release --locked -- -D warnings

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check
