name: Release

# 打 tag 即出包，例如：
#   git tag v0.1.0
#   git push origin v0.1.0
# 产物会作为草稿 release 挂到仓库上，人工确认后再发布。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 构建 Windows 安装包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 未配置代码签名：Windows 用户首次运行可能出现 SmartScreen 提示。
      # 后续如需签名，在 tauri.conf.json 的 bundle.windows 下补 certificateThumbprint
      # 与 digestAlgorithm，并把证书导入到 CI 的 secrets 里。
      - name: 构建并创建草稿 release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'JSON Atlas ${{ github.ref_name }}'
          releaseBody: |
            下载 `*-setup.exe` 安装即可。未配置代码签名，首次运行可能被 SmartScreen 拦截，选择「更多信息 → 仍要运行」。

            Windows 10/11 需要 WebView2 Runtime（通常已随系统预装）。
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
