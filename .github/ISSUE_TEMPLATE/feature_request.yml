name: Feature request
description: Suggest an improvement to JSON Atlas.
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case / 使用场景
      description: What are you trying to do, and where does the current workflow get in the way?
    validations:
      required: true
  - type: textarea
    id: desired-behavior
    attributes:
      label: Desired behavior / 期望行为
      description: Describe the outcome and identify the edition you use (desktop or browser).
    validations:
      required: true
